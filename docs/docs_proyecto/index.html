<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Robot Controller</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Robot Controller</h1>

<div class="container">

    <!-- VIDEO STREAM -->
<div class="card">
    <h2>Video</h2>
    <img id="video" src="http://132.213.198.238:8080/video" width="320" height="240">
</div>


    <!-- CONTROLES -->
    <div class="card">
        <h2>Controles</h2>
        <div class="controls">
            <button onclick="sendCommand('forward 200 1')">↑</button>
            <button onclick="sendCommand('left 200 1')">←</button>
            <button onclick="sendCommand('stop 0 0')">■</button>
            <button onclick="sendCommand('right 200 1')">→</button>
            <button onclick="sendCommand('backward 200 1')">↓</button>
        </div>
    </div>

    <!-- SENSORES -->
    <div class="card">
        <h2>Sensores</h2>
        <pre id="sensorData">Cargando...</pre>
    </div>

    <!-- STATUS -->
    <div class="card">
        <h2>API Status</h2>
        <p id="status">Comprobando...</p>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
